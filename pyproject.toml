[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lactate-analysis"
version = "0.1.0"
description = "Local statistics engine for analyzing lactate-threshold training data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pymc>=5.16",
    "arviz>=1.0",
    "plotly>=5.24",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lactate-report = "lactate_analysis.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lactate_analysis = ["templates/*.j2", "templates/*.js"]
